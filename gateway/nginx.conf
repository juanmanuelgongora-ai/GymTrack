worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Upstreams
    upstream backend {
        server backend:80;
    }

    upstream frontend {
        server frontend:80;
    }

    upstream microservicio-reportes {
        server microservicio-reportes:5001;
    }

    upstream microservicio-acceso {
        server microservicio-acceso:3007;
    }

    upstream microservicio-calculadora {
        server microservicio-calculadora:3000;
    }

    upstream microservicio-chat {
        server microservicio-chat:3006;
    }

    upstream microservicio-notificaciones {
        server microservicio-notificaciones:3005;
    }

    upstream microservicio-rutinas {
        server microservicio-rutinas:3008;
    }

    server {
        listen 80;
        server_name _;

        # Increase buffer sizes for large requests
        client_max_body_size 50M;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;

        # Common proxy headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Auth routes → Laravel backend
        location /api/auth {
            proxy_pass http://backend;
        }

        # Rutinas routes → Laravel backend
        location /api/rutinas {
            proxy_pass http://backend;
        }

        # Clientes routes → Laravel backend
        location /api/clientes {
            proxy_pass http://backend;
        }

        # Reportes → microservicio-reportes
        location /api/reportes {
            proxy_pass http://microservicio-reportes;
        }

        # Acceso (QR) → microservicio-acceso
        location /api/acceso {
            proxy_pass http://microservicio-acceso;
        }

        # Calculadora → microservicio-calculadora
        location /api/calculadora {
            proxy_pass http://microservicio-calculadora;
        }

        # Chat (WebSocket support) → microservicio-chat
        location /api/chat {
            proxy_pass http://microservicio-chat;
        }

        # Notificaciones → microservicio-notificaciones
        location /api/notificaciones {
            proxy_pass http://microservicio-notificaciones;
        }

        # Rutinas microservice → microservicio-rutinas
        location /api/ms-rutinas {
            proxy_pass http://microservicio-rutinas;
        }

        # Socket.io for chat
        location /socket.io/ {
            proxy_pass http://microservicio-chat;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Everything else → frontend
        location / {
            proxy_pass http://frontend;
        }
    }
}
